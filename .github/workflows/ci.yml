name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-15  # Apple Silicon runner with Xcode 16 (Swift 6, swift-testing)
    env:  # step-level env is not visible to a step's `if`, so the "secrets exist" flags live here
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build-app.sh numbers builds by commit count

      - uses: astral-sh/setup-uv@v6

      - name: Bridge self-test
        run: uv run bridge.py selftest

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: app/.build
          key: spm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('app/Package.resolved') }}  # the repo name: .build bakes in absolute paths, so a rename needs a fresh cache

      - name: Unit tests
        working-directory: app
        run: swift test

      # Signing and notarization run only when the secrets exist, so forks and PRs build an ad-hoc signed app.
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"; PASS=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Store notary credentials
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: xcrun notarytool store-credentials mike --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID"

      - name: Build app
        working-directory: app
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ env.HAS_NOTARY == 'true' && 'mike' || '' }}
        run: scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Mike
          path: |
            app/dist/*.zip
            app/dist/*.dmg

      # Release notes: every commit since the previous tag, then GitHub's own section (pull requests, compare link).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          { echo "## Changes"; git log --no-merges --format='- %s' ${prev:+$prev..}HEAD; } > notes.md
          gh release create "$GITHUB_REF_NAME" app/dist/*.zip app/dist/*.dmg --title "Mike $GITHUB_REF_NAME" --notes-file notes.md --generate-notes

permissions:
  contents: write  # for the release on tags
